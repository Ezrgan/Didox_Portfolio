{% load i18n %}
<nav x-data="{ open: false, scrolled: false }" 
     @scroll.window="scrolled = (window.pageYOffset > 20)"
     :class="{ 'bg-white/90 backdrop-blur-md shadow-sm': scrolled, 'bg-transparent': !scrolled }"
     class="fixed w-full z-50 transition-all duration-300">
    <div class="container mx-auto px-6 py-4">
        <div class="flex justify-between items-center">
            <!-- Logo -->
            <!-- Added !text-brand-black and hover:!text-brand-black to override ANY global styles -->
            <a href="{% url 'home' %}" class="text-2xl font-display font-black tracking-tighter text-brand-black hover:text-brand-black !text-brand-black hover:!text-brand-black no-underline z-50 relative">
                BISMARK<span class="text-brand-blue-1">REYES</span>
            </a>

            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center space-x-8">
                <a href="{% url 'home' %}" class="text-sm font-medium text-gray-600 hover:text-brand-black transition-colors no-underline">{% trans "Home" %}</a>
                <a href="{% url 'home' %}#about" class="text-sm font-medium text-gray-600 hover:text-brand-black transition-colors no-underline">{% trans "About" %}</a>
                <a href="{% url 'home' %}#contact" class="text-sm font-medium text-gray-600 hover:text-brand-black transition-colors no-underline">{% trans "Contact" %}</a>
                
                <!-- Projects Button -->
                <!-- Added relative and z-indexes to ensure text stays on top -->
                <a href="{% url 'project_list' %}" class="group relative px-6 py-2.5 bg-brand-black rounded-full overflow-hidden hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5 no-underline">
                    <!-- Background sliding layer -->
                    <span class="absolute inset-0 w-full h-full bg-brand-blue-1 transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300 ease-out z-0"></span>
                    <!-- Text layer -->
                    <span class="relative z-10 text-xs font-bold tracking-widest uppercase text-white group-hover:text-white transition-colors duration-300">{% trans "Projects" %}</span>
                </a>
                
                <!-- Language Selector -->
                <div x-data="{ langOpen: false }" class="relative">
                    <button @click="langOpen = !langOpen" @click.away="langOpen = false" class="flex items-center space-x-1 text-xs font-bold text-gray-500 hover:text-brand-black transition-colors no-underline">
                        <span>{{ LANGUAGE_CODE|upper }}</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div x-show="langOpen" x-cloak class="absolute right-0 mt-2 w-32 bg-white border border-gray-100 rounded-lg shadow-xl py-1 overflow-hidden" 
                         x-transition:enter="transition ease-out duration-100"
                         x-transition:enter-start="opacity-0 transform scale-95"
                         x-transition:enter-end="opacity-100 transform scale-100"
                         x-transition:leave="transition ease-in duration-75"
                         x-transition:leave-start="opacity-100 transform scale-100"
                         x-transition:leave-end="opacity-0 transform scale-95">
                        <form action="{% url 'set_language' %}" method="post">
                            {% csrf_token %}
                            <input name="next" type="hidden" value="{{ request.get_full_path }}">
                            <button type="submit" name="language" value="es" class="block w-full text-left px-4 py-2 text-sm text-gray-500 hover:bg-gray-50 hover:text-brand-black font-medium no-underline">
                                Español
                            </button>
                            <button type="submit" name="language" value="en" class="block w-full text-left px-4 py-2 text-sm text-gray-500 hover:bg-gray-50 hover:text-brand-black font-medium no-underline">
                                English
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Mobile Hamburger Button -->
            <button @click="open = !open" class="md:hidden z-50 text-brand-black focus:outline-none relative">
                 <!-- Icon that transforms -->
                <div class="w-6 h-6 flex flex-col justify-center gap-1.5 overflow-hidden">
                     <!-- Top Line -->
                     <span class="block w-full h-0.5 bg-current transform transition-all duration-300 origin-center" 
                           :class="{ 'rotate-45 translate-y-2': open }"></span>
                     <!-- Middle Line -->
                     <span class="block w-full h-0.5 bg-current transition-all duration-300" 
                           :class="{ 'opacity-0 translate-x-full': open }"></span>
                     <!-- Bottom Line -->
                     <span class="block w-full h-0.5 bg-current transform transition-all duration-300 origin-center" 
                           :class="{ '-rotate-45 -translate-y-2': open }"></span>
                </div>
            </button>
        </div>
    </div>

    <!-- Mobile Full Screen Menu -->
    <!-- Fixed inset-0 z-[100] ensures it covers EVERYTHING. Flex center to structure content. -->
    <div x-show="open" 
         class="fixed inset-0 w-screen h-screen bg-white z-[40] flex flex-col items-center justify-center p-6"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         style="display: none;"> <!-- Inline style for no-js safety, removed by Alpine -->
        
        <div class="flex flex-col items-center gap-8 text-center" @click.away="open = false">
            <a href="{% url 'home' %}" @click="open = false" class="text-3xl font-display font-bold text-brand-black hover:text-brand-blue-1 transition-colors no-underline">{% trans "Home" %}</a>
            <a href="{% url 'home' %}#about" @click="open = false" class="text-3xl font-display font-bold text-brand-black hover:text-brand-blue-1 transition-colors no-underline">{% trans "About" %}</a>
            <a href="{% url 'project_list' %}" @click="open = false" class="text-3xl font-display font-bold text-brand-black hover:text-brand-blue-1 transition-colors no-underline">{% trans "Projects" %}</a>
            <a href="{% url 'home' %}#contact" @click="open = false" class="text-3xl font-display font-bold text-brand-black hover:text-brand-blue-1 transition-colors no-underline">{% trans "Contact" %}</a>
            
            <!-- Mobile Language Selector -->
            <div class="pt-8 w-full border-t border-gray-100 flex justify-center z-[60]">
                <form action="{% url 'set_language' %}" method="post" class="flex justify-center gap-6 items-center">
                    {% csrf_token %}
                    <input name="next" type="hidden" value="{{ request.get_full_path }}">
                    <!-- Added onclick="event.stopPropagation();" to prevent menu closing logic from interfering -->
                    <button type="submit" name="language" value="es" class="text-sm font-bold tracking-widest uppercase transition-colors p-2 z-50 {% if LANGUAGE_CODE == 'es' %}text-brand-black border-b-2 border-brand-black{% else %}text-gray-400 hover:text-brand-black{% endif %}">
                        Español
                    </button>
                    <!-- Added onclick="event.stopPropagation();" -->
                    <button type="submit" name="language" value="en" class="text-sm font-bold tracking-widest uppercase transition-colors p-2 z-50 {% if LANGUAGE_CODE == 'en' %}text-brand-black border-b-2 border-brand-black{% else %}text-gray-400 hover:text-brand-black{% endif %}">
                        English
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
